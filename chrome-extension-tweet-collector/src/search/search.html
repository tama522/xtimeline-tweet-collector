<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XTimeline — Search</title>
  <link rel="stylesheet" href="search.css">
</head>
<body>
  <div class="app">
    <div class="sidebar">
      <div class="logo">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="8" fill="url(#g)"/>
          <path d="M8 9h12a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3H12l-4 4V9z" fill="#111" opacity=".8"/>
          <path d="M10 14h8m-8 3h6" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
          <defs><linearGradient id="g" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs>
        </svg>
        <span class="logo-text">XTimeline</span>
      </div>

      <nav>
        <a class="nav-item active" href="#">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          検索
        </a>
        <a class="nav-item" href="#" id="btnExportJSON">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          エクスポート
        </a>
        <a class="nav-item" href="../options/options.html" target="_blank">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          設定
        </a>
      </nav>

      <div class="sidebar-stats">
        <div class="stat-item">
          <div class="stat-val" id="stats">—</div>
          <div class="stat-lbl">ツイート保存済み</div>
        </div>
      </div>
    </div>

    <div class="main">
      <div class="search-bar">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="ツイートを検索…" autofocus>
        <div class="filter-pills">
          <select id="viewedAsFilter">
            <option value="">👁 全アカウント</option>
          </select>
          <select id="userFilter">
            <option value="">👤 全ユーザー</option>
          </select>
        </div>
      </div>

      <div class="results-bar">
        <span class="results-count" id="resultsInfo">読み込み中…</span>
      </div>

      <div class="tweet-list" id="tweetList"></div>
    </div>
  </div>

  <script src="../lib/db.js"></script>
  <script src="search.js"></script>
</body>
</html>
