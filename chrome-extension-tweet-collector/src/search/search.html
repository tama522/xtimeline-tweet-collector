<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XTimeline — Search</title>
  <link rel="stylesheet" href="search.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-left">
        <strong class="brand">XTimeline</strong>
      </div>
      <div class="topbar-center">
        <div class="search-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="searchInput" placeholder="ツイートを検索…" autofocus>
        </div>
      </div>
      <div class="topbar-right">
        <select id="viewedAsFilter">
          <option value="">👁 すべてのアカウント</option>
        </select>
        <select id="userFilter">
          <option value="">👤 すべてのユーザー</option>
        </select>
        <button class="btn btn-outline" id="btnExportJSON">JSON</button>
        <button class="btn btn-outline" id="btnExportCSV">CSV</button>
        <a class="btn btn-outline" href="../options/options.html" target="_blank">設定</a>
      </div>
    </header>

    <div class="layout">
      <aside class="aside">
        <div class="aside-card">
          <div class="aside-label">保存済み</div>
          <div class="aside-big" id="stats">—</div>
        </div>
        <div class="aside-card">
          <div class="aside-label">最近保存したツイート</div>
          <div class="aside-list" id="recentList">
            <div class="aside-empty">読み込み中…</div>
          </div>
        </div>
      </aside>

      <main class="content">
        <div class="content-header">
          <span class="results-count" id="resultsInfo">最新のツイート</span>
        </div>
        <div class="tweet-list" id="tweetList"></div>
      </main>
    </div>
  </div>

  <script src="../lib/db.js"></script>
  <script src="search.js"></script>
</body>
</html>
