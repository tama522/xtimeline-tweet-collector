<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XTimeline</title>
  <link rel="stylesheet" href="search.css">
</head>
<body>
  <div class="shell">
    <!-- HEADER -->
    <header class="hdr">
      <div class="hdr-l">
        <span class="brand">𝕏 Timeline</span>
        <span class="brand-sub">collector</span>
      </div>
      <div class="hdr-c">
        <div class="search-pill">
          <input type="text" id="searchInput" placeholder="検索…" autofocus>
          <kbd>⌘K</kbd>
        </div>
      </div>
      <div class="hdr-r">
        <select id="viewedAsFilter"><option value="">全アカウント</option></select>
        <select id="userFilter"><option value="">全ユーザー</option></select>
        <span class="sep"></span>
        <button class="pill-btn" id="btnExportJSON">↓ JSON</button>
        <button class="pill-btn" id="btnExportCSV">↓ CSV</button>
        <a class="pill-btn" href="../options/options.html" target="_blank">⚙</a>
      </div>
    </header>

    <!-- DASHBOARD VIEW -->
    <div class="dash" id="dashboardView">
      <!-- KPI row -->
      <div class="kpi-row">
        <div class="kpi">
          <div class="kpi-num" id="kTotal">—</div>
          <div class="kpi-label">保存済み</div>
        </div>
        <div class="kpi">
          <div class="kpi-num" id="kAccounts">—</div>
          <div class="kpi-label">アカウント</div>
        </div>
        <div class="kpi">
          <div class="kpi-num" id="kUsers">—</div>
          <div class="kpi-label">投稿者</div>
        </div>
        <div class="kpi">
          <div class="kpi-num" id="kToday">—</div>
          <div class="kpi-label">本日</div>
        </div>
      </div>

      <div class="dash-grid">
        <!-- Account breakdown -->
        <div class="panel">
          <div class="panel-h">アカウント別内訳</div>
          <div class="panel-body" id="accountChart"></div>
        </div>

        <!-- Top authors -->
        <div class="panel">
          <div class="panel-h">よく見る投稿者 TOP 10</div>
          <div class="panel-body" id="topAuthors"></div>
        </div>

        <!-- Recent -->
        <div class="panel panel-wide">
          <div class="panel-h">
            最近のツイート
            <button class="link-btn" id="btnViewAll">すべて見る →</button>
          </div>
          <div class="panel-body" id="recentTable"></div>
        </div>

        <!-- Media -->
        <div class="panel panel-wide">
          <div class="panel-h">最近のメディア</div>
          <div class="media-strip" id="mediaStrip"></div>
        </div>
      </div>
    </div>

    <!-- SEARCH RESULTS VIEW (hidden by default) -->
    <div class="results" id="resultsView" style="display:none">
      <div class="results-hdr">
        <button class="link-btn" id="btnBack">← ダッシュボード</button>
        <span id="resultsInfo"></span>
      </div>
      <div class="tweet-list" id="tweetList"></div>
    </div>
  </div>

  <script src="../lib/db.js"></script>
  <script src="search.js"></script>
</body>
</html>
