<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --bg: #f8f9fa;
      --surface: #ffffff;
      --border: #e9ecef;
      --border2: #dee2e6;
      --text: #212529;
      --text2: #495057;
      --text3: #868e96;
      --accent: #4361ee;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--surface);
      color: var(--text);
      padding: 20px;
      font-size: 13px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .brand {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.02em;
    }
    .status {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 10px;
    }
    .status.on {
      background: #d3f9d8;
      color: #2b8a3e;
    }
    .status.off {
      background: #ffe3e3;
      color: #c92a2a;
    }

    .account-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 14px;
    }
    .account-row .lbl { color: var(--text3); font-size: 12px; }
    .account-row .val { font-weight: 600; color: var(--accent); }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
    }
    .card .num {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
    }
    .card .lbl {
      font-size: 11px;
      color: var(--text3);
      margin-top: 2px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.1s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      margin-bottom: 6px;
    }
    .btn-stop {
      background: #c92a2a;
      color: #fff;
      margin-bottom: 6px;
    }
    .btn-search {
      background: var(--bg);
      border: 1px solid var(--border2);
      color: var(--text);
    }

    .footer {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .footer a {
      font-size: 12px;
      color: var(--text3);
      text-decoration: none;
      font-weight: 500;
    }
    .footer a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="top">
    <span class="brand">XTimeline</span>
    <span class="status on" id="statusBadge">ON</span>
  </div>

  <div class="account-row">
    <span class="lbl">閲覧中</span>
    <span class="val" id="viewingAccount">—</span>
  </div>

  <div class="grid">
    <div class="card">
      <div class="num" id="savedCount">—</div>
      <div class="lbl">保存済み</div>
    </div>
    <div class="card">
      <div class="num" id="sessionCount">—</div>
      <div class="lbl">本セッション</div>
    </div>
  </div>

  <button class="btn btn-stop" id="btnToggle">⏸ 停止</button>
  <button class="btn btn-search" id="btnSearch">🔍 検索</button>

  <div class="footer">
    <a href="#" id="btnExportJSON">JSON</a>
    <a href="#" id="btnExportCSV">CSV</a>
    <a href="../options/options.html" target="_blank">設定</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
