<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f4f5f7; --card: #fff; --line: #e2e4e8;
      --t: #171923; --t2: #4a5568; --t3: #97a0af;
      --accent: #6c5ce7; --green: #00b894; --red: #e17055;
    }
    body { width: 360px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif; background: var(--bg); color: var(--t); font-size: 13px; }

    .hero { background: var(--accent); padding: 18px 20px 14px; color: #fff; position: relative; overflow: hidden; }
    .hero::after { content: ''; position: absolute; right: -30px; top: -30px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,0.08); }
    .hero-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .hero-brand { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
    .hero-tag { font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 20px; background: rgba(255,255,255,0.2); letter-spacing: 0.05em; }
    .hero-account { display: flex; align-items: center; gap: 8px; }
    .hero-dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 6px rgba(255,255,255,0.6); }
    .hero-dot.on { background: #55efc4; }
    .hero-dot.off { background: #fdcb6e; }
    .hero-acc-name { font-size: 14px; font-weight: 600; }
    .hero-acc-sub { font-size: 11px; opacity: 0.7; margin-left: 4px; }

    .body { padding: 14px 16px 16px; }
    .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .stat-box { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 10px; text-align: center; }
    .stat-num { font-family: 'SF Mono', 'Menlo', 'Consolas', monospace; font-size: 22px; font-weight: 700; }
    .stat-num.purple { color: var(--accent); }
    .stat-num.green { color: var(--green); }
    .stat-label { font-size: 10px; color: var(--t3); margin-top: 2px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }

    .last-tweet { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
    .last-tweet-label { font-size: 10px; color: var(--t3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
    .lt-user { font-size: 13px; font-weight: 600; color: var(--accent); }
    .lt-text { font-size: 13px; color: var(--t2); margin-top: 4px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .lt-time { font-size: 11px; color: var(--t3); margin-top: 6px; font-family: 'SF Mono', 'Menlo', 'Consolas', monospace; }

    .btn { display: block; width: 100%; padding: 10px; border: none; border-radius: 10px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; }
    .btn-on { background: var(--accent); color: #fff; margin-bottom: 8px; }
    .btn-off { background: var(--line); color: var(--t2); margin-bottom: 8px; }
    .btn-search { background: var(--t); color: #fff; }

    .debug-toggle { text-align: center; margin-top: 10px; }
    .debug-toggle a { font-size: 11px; color: var(--t3); text-decoration: none; cursor: pointer; }
    .debug-toggle a:hover { color: var(--accent); }
    .debug-log {
      display: none; margin-top: 8px; max-height: 140px; overflow-y: auto;
      background: #1a1a2e; color: #a29bfe; font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
      font-size: 10px; padding: 8px 10px; border-radius: 8px; line-height: 1.5;
    }
    .debug-log.show { display: block; }
    .debug-log::-webkit-scrollbar { width: 4px; }
    .debug-log::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .foot { display: flex; justify-content: center; gap: 14px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
    .foot a { font-size: 12px; color: var(--t3); text-decoration: none; font-weight: 500; }
    .foot a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="hero">
    <div class="hero-top">
      <span class="hero-brand">𝕏 Timeline</span>
      <span class="hero-tag">GraphQL</span>
    </div>
    <div class="hero-account">
      <div class="hero-dot" id="statusDot"></div>
      <span class="hero-acc-name" id="viewingAccount">未接続</span>
      <span class="hero-acc-sub" id="statusLabel"></span>
    </div>
  </div>

  <div class="body">
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-num purple" id="savedCount">—</div>
        <div class="stat-label">保存</div>
      </div>
      <div class="stat-box">
        <div class="stat-num green" id="sessionCount">—</div>
        <div class="stat-label">セッション</div>
      </div>
    </div>

    <div class="last-tweet" id="lastTweetBlock" style="display:none">
      <div class="last-tweet-label">最後にキャプチャ</div>
      <span class="lt-user" id="ltUser"></span>
      <div class="lt-text" id="ltText"></div>
      <div class="lt-time" id="ltTime"></div>
    </div>

    <button class="btn btn-on" id="btnToggle">⏸ 停止</button>
    <button class="btn btn-search" id="btnSearch">🔍 ダッシュボードを開く</button>

    <div class="debug-toggle"><a id="btnDebug">デバッグログを表示</a></div>
    <div class="debug-log" id="debugLog"></div>

    <div class="foot">
      <a href="../options/options.html" target="_blank">設定</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
