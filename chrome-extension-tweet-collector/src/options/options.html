<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>XTimeline — 設定</title>
  <style>
    :root {
      --bg: #f8f9fa;
      --surface: #ffffff;
      --border: #e9ecef;
      --border2: #dee2e6;
      --text: #212529;
      --text2: #495057;
      --text3: #868e96;
      --accent: #4361ee;
      --accent-light: rgba(67,97,238,0.06);
      --radius: 10px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 20px;
      font-size: 14px;
    }

    .container { max-width: 600px; margin: 0 auto; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 28px; color: var(--accent); letter-spacing: -0.02em; }

    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 16px;
    }
    .section h2 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .section p {
      font-size: 13px;
      color: var(--text3);
      margin-bottom: 16px;
    }

    .account-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .account-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .account-item:hover { border-color: var(--accent); }
    .account-item input[type="checkbox"] {
      accent-color: var(--accent);
      width: 18px;
      height: 18px;
    }
    .account-item .name {
      font-size: 14px;
      font-weight: 600;
    }
    .account-empty {
      color: var(--text3);
      font-size: 13px;
      padding: 12px 0;
      text-align: center;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
    }
    .toggle-row label { font-size: 14px; }
    .toggle { position: relative; width: 40px; height: 22px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .slider {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--border2); border-radius: 11px; cursor: pointer; transition: 0.2s;
    }
    .toggle .slider::before {
      content: ''; position: absolute;
      width: 16px; height: 16px; left: 3px; bottom: 3px;
      background: #fff; border-radius: 50%; transition: 0.2s;
    }
    .toggle input:checked + .slider { background: var(--accent); }
    .toggle input:checked + .slider::before { transform: translateX(18px); }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .form-group input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border2);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
    }
    .form-group input:focus { border-color: var(--accent); outline: none; }
    .form-group .hint { font-size: 11px; color: var(--text3); margin-top: 4px; }
    .form-group select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border2);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
    }

    .btn-row { display: flex; gap: 8px; margin-top: 16px; }
    .btn {
      padding: 8px 20px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-danger { background: #fff; border: 1px solid #c92a2a; color: #c92a2a; }
    .btn-danger:hover { background: #fff5f5; }
    .btn-sm { padding: 4px 12px; font-size: 12px; }

    .status-msg {
      margin-top: 8px; padding: 8px 12px; border-radius: 6px;
      font-size: 13px; display: none; font-weight: 500;
    }
    .status-msg.show { display: block; }
    .status-msg.success { background: #d3f9d8; color: #2b8a3e; }
    .status-msg.error { background: #ffe3e3; color: #c92a2a; }

    .storage-info { font-size: 13px; color: var(--text3); margin-bottom: 12px; }
    .storage-info strong { color: var(--text); }
  </style>
</head>
<body>
  <div class="container">
    <h1>XTimeline 設定</h1>

    <div class="section">
      <h2>🎯 収集対象アカウント</h2>
      <p>チェックを入れたアカウントでXを見ている時だけツイートを保存します。X.comにログインすると自動検出されます。</p>
      <div class="account-list" id="accountList">
        <div class="account-empty">まだアカウントが検出されていません。X.comにログインしてください。</div>
      </div>
      <div class="btn-row" style="margin-top:8px">
        <button class="btn btn-primary btn-sm" id="btnRefresh">🔄 再検出</button>
      </div>
    </div>

    <div class="section">
      <h2>📡 収集設定</h2>
      <div class="toggle-row">
        <label>拡張機能を有効にする</label>
        <div class="toggle"><input type="checkbox" id="isEnabled"><span class="slider"></span></div>
      </div>
      <div class="toggle-row">
        <label>リツイートも収集</label>
        <div class="toggle"><input type="checkbox" id="collectRetweets"><span class="slider"></span></div>
      </div>
      <div class="toggle-row">
        <label>リプライも収集</label>
        <div class="toggle"><input type="checkbox" id="collectReplies"><span class="slider"></span></div>
      </div>
      <div class="form-group">
        <label>除外キーワード</label>
        <input type="text" id="excludeKeywords" placeholder="キーワード1, キーワード2">
        <div class="hint">カンマ区切り</div>
      </div>
    </div>

    <div class="section">
      <h2>🔗 外部連携（Webhook）</h2>
      <div class="toggle-row">
        <label>Webhookを有効にする</label>
        <div class="toggle"><input type="checkbox" id="webhookEnabled"><span class="slider"></span></div>
      </div>
      <div class="form-group">
        <label>Webhook URL</label>
        <input type="text" id="webhookUrl" placeholder="https://your-api.example.com/webhook/tweets">
      </div>
    </div>

    <div class="section">
      <h2>💾 データ管理</h2>
      <div class="storage-info" id="storageInfo">読み込み中…</div>
      <div class="form-group">
        <label>データ保持期間</label>
        <select id="dataRetentionDays">
          <option value="0">無期限</option>
          <option value="7">7日</option>
          <option value="30">30日</option>
          <option value="90">90日</option>
          <option value="180">180日</option>
          <option value="365">1年</option>
        </select>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="btnSave">💾 保存</button>
        <button class="btn btn-danger" id="btnClearData">🗑 全削除</button>
      </div>
      <div class="status-msg" id="statusMsg"></div>
    </div>

    <div class="section">
      <h2>🐛 デバッグ</h2>
      <div class="toggle-row">
        <label>デバッグモード</label>
        <div class="toggle"><input type="checkbox" id="debugMode"><span class="slider"></span></div>
      </div>
    </div>
  </div>

  <script src="../lib/db.js"></script>
  <script src="options.js"></script>
</body>
</html>
