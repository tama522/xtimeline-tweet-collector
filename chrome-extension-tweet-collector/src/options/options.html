<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>XTimeline - 設定</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #15202b;
      color: #e7e9ea;
      min-height: 100vh;
      padding: 24px;
    }
    .container { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 24px; margin-bottom: 24px; }

    .section {
      background: #192734;
      border: 1px solid #38444d;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .section h2 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #1d9bf0;
    }
    .section p {
      font-size: 13px;
      color: #8899a6;
      margin-bottom: 12px;
    }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .form-group input[type="text"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #38444d;
      border-radius: 8px;
      background: #253341;
      color: #e7e9ea;
      font-size: 14px;
      font-family: inherit;
    }
    .form-group input:focus { border-color: #1d9bf0; outline: none; }
    .form-group .hint { font-size: 11px; color: #8899a6; margin-top: 4px; }

    .account-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }
    .account-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: #253341;
      border: 1px solid #38444d;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .account-item:hover { border-color: #1d9bf0; }
    .account-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #1d9bf0;
      cursor: pointer;
    }
    .account-item .name {
      font-size: 14px;
      font-weight: 600;
    }
    .account-item .tag {
      font-size: 11px;
      color: #8899a6;
      margin-left: auto;
    }
    .account-empty {
      color: #8899a6;
      font-size: 13px;
      padding: 12px;
      text-align: center;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }
    .toggle-row label { font-size: 14px; }
    .toggle { position: relative; width: 44px; height: 24px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .slider {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: #38444d; border-radius: 12px; cursor: pointer; transition: 0.2s;
    }
    .toggle .slider::before {
      content: ''; position: absolute;
      height: 18px; width: 18px; left: 3px; bottom: 3px;
      background: #e7e9ea; border-radius: 50%; transition: 0.2s;
    }
    .toggle input:checked + .slider { background: #1d9bf0; }
    .toggle input:checked + .slider::before { transform: translateX(20px); }

    .btn { padding: 8px 20px; border: none; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: #1d9bf0; color: #fff; }
    .btn-primary:hover { background: #1a8cd8; }
    .btn-danger { background: transparent; border: 1px solid #f4212e; color: #f4212e; }
    .btn-danger:hover { background: rgba(244, 33, 46, 0.1); }
    .btn-sm { padding: 4px 12px; font-size: 12px; }

    .btn-row { display: flex; gap: 8px; margin-top: 12px; }

    .status-msg {
      margin-top: 8px; padding: 8px 12px; border-radius: 8px;
      font-size: 13px; display: none;
    }
    .status-msg.show { display: block; }
    .status-msg.success { background: rgba(0, 186, 124, 0.15); color: #00ba7c; }
    .status-msg.error { background: rgba(244, 33, 46, 0.15); color: #f4212e; }

    .storage-info { font-size: 13px; color: #8899a6; }
    .storage-info strong { color: #e7e9ea; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚙️ XTimeline Tweet Collector 設定</h1>

    <!-- Account checkboxes -->
    <div class="section">
      <h2>🎯 収集対象アカウント</h2>
      <p>チェックを入れたアカウントでXを見ている時だけツイートを保存します。<br>
      アカウントはX.comにログインすると自動検出されます。デフォルトは全てOFF（保存しない）。</p>
      <div class="account-list" id="accountList">
        <div class="account-empty">まだアカウントが検出されていません。X.comにログインしてください。</div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary btn-sm" id="btnRefresh">🔄 再検出</button>
      </div>
    </div>

    <!-- Collection Settings -->
    <div class="section">
      <h2>📡 収集設定</h2>
      <div class="toggle-row">
        <label>拡張機能を有効にする</label>
        <div class="toggle"><input type="checkbox" id="isEnabled"><span class="slider"></span></div>
      </div>
      <div class="toggle-row">
        <label>リツイートも収集</label>
        <div class="toggle"><input type="checkbox" id="collectRetweets"><span class="slider"></span></div>
      </div>
      <div class="toggle-row">
        <label>リプライも収集</label>
        <div class="toggle"><input type="checkbox" id="collectReplies"><span class="slider"></span></div>
      </div>
      <div class="form-group">
        <label>除外キーワード</label>
        <input type="text" id="excludeKeywords" placeholder="キーワード1, キーワード2">
        <div class="hint">カンマ区切り</div>
      </div>
    </div>

    <!-- Webhook -->
    <div class="section">
      <h2>🔗 外部連携（Webhook）</h2>
      <div class="toggle-row">
        <label>Webhookを有効にする</label>
        <div class="toggle"><input type="checkbox" id="webhookEnabled"><span class="slider"></span></div>
      </div>
      <div class="form-group">
        <label>Webhook URL</label>
        <input type="text" id="webhookUrl" placeholder="https://your-api.example.com/webhook/tweets">
      </div>
    </div>

    <!-- Data Management -->
    <div class="section">
      <h2>💾 データ管理</h2>
      <div class="storage-info" id="storageInfo">読み込み中...</div>
      <div class="form-group" style="margin-top: 12px;">
        <label>データ保持期間</label>
        <select id="dataRetentionDays" style="padding:8px;border:1px solid #38444d;border-radius:8px;background:#253341;color:#e7e9ea;">
          <option value="0">無期限</option>
          <option value="7">7日</option>
          <option value="30">30日</option>
          <option value="90">90日</option>
          <option value="180">180日</option>
          <option value="365">1年</option>
        </select>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="btnSave">💾 設定を保存</button>
        <button class="btn btn-danger" id="btnClearData">🗑 全データ削除</button>
      </div>
      <div class="status-msg" id="statusMsg"></div>
    </div>

    <!-- Debug -->
    <div class="section">
      <h2>🐛 デバッグ</h2>
      <div class="toggle-row">
        <label>デバッグモード</label>
        <div class="toggle"><input type="checkbox" id="debugMode"><span class="slider"></span></div>
      </div>
    </div>
  </div>

  <script src="../lib/db.js"></script>
  <script src="options.js"></script>
</body>
</html>
